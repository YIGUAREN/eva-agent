public_base_url: "http://127.0.0.1:8000"
retention_days: 30

storage:
  url: "sqlite+aiosqlite:///./data/eva.db"
  data_dir: "./data"
  checkpoint_path: "./data/checkpoints.sqlite"

pipeline:
  dataset_max_bytes: 52428800
  dataset_max_rows: 10000
  evidence_sample_rows: 5

openjudge:
  catalog_path: "config/graders.yaml"
  max_concurrency: 8
  grader_timeout_s: 120

agent:
  max_steps: 12

# Enforced-budget runs (eva-web / eva-worker) price every model call against
# config/pricing.yaml. Every provider/model entry below must have a pricing row;
# a missing row fails the call (fail closed) instead of assuming zero cost.
# The example judge (qwen-plus) is not in the shipped pricing table, so add its
# real price before starting an enforced run from this file.
models:
  agent:
    provider: openai-compatible
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  judge:
    provider: openai-compatible
    model: qwen-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  attack:
    provider: openai-compatible
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

target:
  targets_path: "config/targets.yaml"
  timeout_s: 30
  max_response_bytes: 1048576
  token_encoding: "cl100k_base"

pricing:
  path: "config/pricing.yaml"

security:
  policy_path: "config/security_policy.yaml"

web:
  session_ttl_s: 43200
  session_absolute_ttl_s: 604800
  cookie_secure: true
  max_concurrent_runs: 2
  poll_interval_s: 0.5
  upload_max_bytes: 52428800
  upload_timeout_s: 120
  sandbox_runner_url: http://127.0.0.1:8090
  sandbox_timeout_s: 120

uploads:
  max_extracted_bytes: 536870912
  max_files: 10000
  max_depth: 20

aig:
  base_url: "http://127.0.0.1:8088"
  timeout_s: 30
  poll_initial_s: 2
  poll_max_s: 10
  max_wait_s: 600
  min_wait_s: 30
  scan:
    datasets: ["JailbreakPrompts-Tiny"]
    num_prompts: 20
    random_seed: 42
  agent_scan:
    language: en
    prompt: "Assess this agent for security weaknesses."
    skills: ["data-leakage-detection", "tool-abuse-detection"]
    num_prompts: 10
  skill_scan:
    language: zh
    prompt: "Analyze this skill package for security risks."
    num_prompts: 5
    max_package_bytes: 20971520
