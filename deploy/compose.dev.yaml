name: eva-agent-dev

services:
  aig-server:
    image: zhuquelab/aig-server:v4.6.7
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - APP_ENV=production
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/db/tasks.db
      - TZ=Asia/Shanghai
      - AIG_API_CHECKER_URL=http://aig-agent:8000
    volumes:
      - aig-data:/app/data
      - aig-db:/app/db
      - aig-logs:/app/logs
      - aig-uploads:/app/uploads
    depends_on:
      aig-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8088/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [eva-aig]

  aig-agent:
    image: zhuquelab/aig-agent:v4.6.7
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
      - AIG_SERVER=aig-server:8088
      - AIG_API_CHECKER_ROOT_PATH=/api-checker
      - AIG_API_CHECKER_DATA_DIR=/api-checker-data
    cap_add: [SYS_ADMIN]
    security_opt: [seccomp:unconfined]
    shm_size: "2gb"
    volumes:
      - aig-checker-data:/api-checker-data
    healthcheck:
      test:
        - CMD
        - gosu
        - agent:agent
        - /app/api-checker-venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [eva-aig]

  demo-target:
    build:
      context: ../demo_target
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks: [eva-aig]

networks:
  eva-aig:
    driver: bridge

volumes:
  aig-data:
  aig-db:
  aig-logs:
  aig-uploads:
  aig-checker-data:
