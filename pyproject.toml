[project]
name = "eva-agent"
version = "0.1.0"
description = "Autonomous evaluation agent for AI applications"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "py-openjudge==0.2.4",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "httpcore>=1.0,<2",
    "httpx>=0.28",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
eva = "eva_agent.cli:main"
eva-web = "eva_agent.server.main:main"
eva-worker = "eva_agent.worker.main:main"
eva-sandbox = "eva_agent.sandbox.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest-cov>=7.1.0",
]
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eva_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not aig'"
markers = [
    "aig: requires a running AIG dev stack; excluded by default",
]

[tool.coverage.run]
source = ["eva_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "demo_target"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
